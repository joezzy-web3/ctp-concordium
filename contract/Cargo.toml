[package]
name = "ctp_escrow"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Clear to Pay escrow: supplier payment rules enforced on-chain (Concordium)"

[features]
# Builds the AgentView test helper into the library (used by the mock registry).
mock = []
# Mainnet build: the payout hold is at least 24 hours.
mainnet = []

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = "s"
codegen-units = 1

[dependencies]
concordium-std = "11.0.0"

[dev-dependencies]
concordium-smart-contract-testing = "5.0.0"
sha2 = "0.10"
