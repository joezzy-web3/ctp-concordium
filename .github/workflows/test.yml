name: test
on: [push, pull_request]
permissions:
  contents: read

jobs:
  node:
    name: Node tests and reproducible page bundles
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - name: Committed page bundles match their source
        if: runner.os == 'Linux'
        run: |
          npm run -s build:pages
          git diff --exit-code -- sign/app.js anchor/app.js link/app.js deploy/app.js console/app.js app/app.js

  contract:
    name: Escrow contract (rules, WASM build, end-to-end tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contract
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-concordium
            ~/.cargo/registry
            contract/target
            contract/mock-registry/target
          key: cargo-${{ runner.os }}-${{ hashFiles('contract/Cargo.lock', 'contract/mock-registry/Cargo.lock', 'contract/rust-toolchain.toml') }}
      - name: Install cargo-concordium
        run: command -v cargo-concordium || cargo install --locked cargo-concordium
      - run: cargo test --lib
      - name: Build the test-only stand-in registry
        run: cd mock-registry && cargo concordium build --out mock_registry.wasm.v1
      - run: cargo concordium build --out ctp_escrow.wasm.v1
      - run: cargo test --test escrow
      - name: Module hash (host build, used by the tests)
        run: sha256sum ctp_escrow.wasm.v1
      - name: Verifiable build (Concordium's build image; this is the module to deploy)
        run: |
          mkdir -p dist
          cargo concordium build --verifiable --out dist/ctp_escrow.wasm.v1
          ls -la dist
          sha256sum dist/*
      - name: Re-verify the module against its packaged source
        run: cargo concordium verify-build --module dist/ctp_escrow.wasm.v1 --source dist/ctp_escrow.wasm.v1.tar
      - name: Embedded parameter schema (base64, for the console page)
        run: |
          cargo concordium schema-base64 --module dist/ctp_escrow.wasm.v1 --out dist/schema.b64
          echo "SCHEMA_B64=$(tr -d '\n' < dist/schema.b64)"
      - uses: actions/upload-artifact@v4
        with:
          name: ctp_escrow-verifiable
          path: contract/dist/
